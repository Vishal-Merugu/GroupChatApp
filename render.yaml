# Render blueprint — free tier, no credit card. One web service plus a managed
# Postgres. Matches the project's zero-budget constraint (spec section 11.2).
#
# Deploy: push to GitHub, then New > Blueprint on render.com and pick this repo.
# JWT_SECRET_KEY is generated by Render; the rest are wired automatically.

services:
  - type: web
    name: groupchat-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET_KEY
        generateValue: true
      # Schema is applied from the models at boot — no data to preserve yet.
      - key: DB_SYNC
        value: 'true'
      - key: DB_SSL
        value: 'true'
      - key: APP_BASE_URL
        fromService:
          type: web
          name: groupchat-ai
          envVarKey: RENDER_EXTERNAL_URL
      - key: DB_HOST
        fromDatabase: { name: groupchat-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: groupchat-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: groupchat-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: groupchat-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: groupchat-db, property: password }

databases:
  - name: groupchat-db
    plan: free
    postgresMajorVersion: '16'
