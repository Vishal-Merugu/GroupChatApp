services:
  db:
    # pgvector image so Stage E (embedding pipeline) needs no infra change — Decision 2.
    image: pgvector/pgvector:pg16
    container_name: groupchat-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-groupchat}
    ports:
      - "${DB_PORT:-54322}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-groupchat}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
